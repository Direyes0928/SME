<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SME Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e5e7eb;
    }

    header {
      padding: 1rem;
      background: transparent;
      border-bottom: 1px solid #1e293b;
    }

    section {
      padding: 1rem;
      border-bottom: 1px solid #1e293b;
    }

    .card {
      background: #020617;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 20px rgba(0,255,255,0.05);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      transition: border-color 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #020617;
      padding: 1rem;
      border-right: 1px solid #1e293b;
    }

    .sidebar h3 {
      margin-top: 0;
      color: #60a5fa;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .sidebar li:hover {
      background: #1e293b;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .content section {
      padding: 0;
      margin-bottom: 1rem;
      border-bottom: none;
    }

    .chat-section {
      padding: 1rem;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid #1e293b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeIn 0.5s ease-out;
    }
  </style>
</head>

<body>

<div class="app">
<aside class="sidebar">
<h3>SME Agent</h3>
<ul>
<li>Dashboard</li>
<li>History</li>
<li>Settings</li>
</ul>
</aside>

<div class="main">
<header>
  <h2>Dashboard</h2>
  <small>Your personal context assistant</small>
</header>

<div class="content">
<section>
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 7V3M16 7V3M7 11H17M5 21H19C20.1046 21 21 20.1046 21 19V7C21 5.89543 20.1046 5 19 5H5C3.89543 5 3 5.89543 3 7V19C3 20.1046 3.89543 21 5 21Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Today</strong>
    <p>No upcoming events loaded.</p>
  </div>
</section>

<section>
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H12L10 5H5C3.89543 5 3 5.89543 3 7Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Sources</strong>
    <p>Notes: Not connected</p>
    <p>Documents: Not connected</p>
    <p>Calendar: Not connected</p>
  </div>
</section>
</div>

<section class="chat-section">
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.5 2C5.35786 2 2 5.35786 2 9.5C2 13.6421 5.35786 17 9.5 17C13.6421 17 17 13.6421 17 9.5C17 5.35786 13.6421 2 9.5 2Z" stroke="#e5e7eb" stroke-width="2"/><path d="M9.5 6C7.567 6 6 7.567 6 9.5C6 11.433 7.567 13 9.5 13C11.433 13 13 11.433 13 9.5C13 7.567 11.433 6 9.5 6Z" stroke="#e5e7eb" stroke-width="2"/><path d="M9.5 9.5L9.5 9.5" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/></svg> Ask Your SME</strong>
    <input type="text" placeholder="What should I review today?" />
  </div>
</section>
</div>
</div>

</body>
</html>
