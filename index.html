<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SME Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e5e7eb;
    }

    header {
      padding: 1rem;
      background: transparent;
      border-bottom: 1px solid #1e293b;
    }

    section {
      padding: 1rem;
      border-bottom: 1px solid #1e293b;
    }

    .card {
      background: #020617;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 20px rgba(0,255,255,0.05);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      transition: border-color 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #020617;
      padding: 1rem;
      border-right: 1px solid #1e293b;
    }

    .sidebar h3 {
      margin-top: 0;
      color: #60a5fa;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .sidebar li:hover {
      background: #1e293b;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .content section {
      padding: 0;
      margin-bottom: 1rem;
      border-bottom: none;
    }

    .chat-section {
      padding: 1rem;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid #1e293b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeIn 0.5s ease-out;
    }
  </style>
</head>

<body>

<div class="app">
<aside class="sidebar">
<h3>SME Agent</h3>
<ul>
<li>Dashboard</li>
<li>History</li>
<li>Settings</li>
</ul>
</aside>

<div class="main">
<header>
  <h2>Dashboard</h2>
  <small>Your personal context assistant</small>
</header>

<div class="content">
<section>
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 7V3M16 7V3M7 11H17M5 21H19C20.1046 21 21 20.1046 21 19V7C21 5.89543 20.1046 5 19 5H5C3.89543 5 3 5.89543 3 7V19C3 20.1046 3.89543 21 5 21Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Today</strong>
    <p>No upcoming events loaded.</p>
  </div>
</section>

<section>
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H12L10 5H5C3.89543 5 3 5.89543 3 7Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Sources</strong>
    <p>Notes: Not connected</p>
    <p>Documents: Not connected</p>
    <p>Calendar: Not connected</p>
  </div>
</section>

<section>
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H12L10 5H5C3.89543 5 3 5.89543 3 7Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Load Documents</strong>
    <input type="file" id="fileInput" multiple />
    <p id="fileStatus">No files loaded.</p>
    <p id="chunkStatus">No chunks created.</p>
    <ul id="fileList"></ul>
  </div>
</section>
</div>

<section class="chat-section">
  <div class="card">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21L16.5 16.5M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 3 19 11Z" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Ask Your SME</strong>
    <input
      type="text"
      id="searchInput"
      placeholder="Ask a question or type keywords..."
    />
    <div id="searchResults"></div>
  </div>
</section>
</div>
</div>

<script>
// new 2026-01-12
const fileInput = document.getElementById("fileInput");
const fileStatus = document.getElementById("fileStatus");
const fileList = document.getElementById("fileList");
const chunkStatus = document.getElementById("chunkStatus");

const documents = []; // new 2026-01-12
const chunks = []; // new 2026-01-12

fileInput.addEventListener("change", async (event) => {
  const files = Array.from(event.target.files);

  for (const file of files) {
    const text = await readFileText(file);

    documents.push({
      id: crypto.randomUUID(),
      name: file.name,
      type: file.type,
      text,
      loadedAt: new Date().toISOString()
    });
  }

  renderFileStatus();

  chunkAllDocuments(); // new 2026-01-12
});

// new 2026-01-12
async function readFileText(file) {
  // Handles basic text-based files
  if (file.type.startsWith("text/")) {
    return await file.text();
  }

  // Fallback for unsupported types
  return "[Unsupported file type: text extraction pending]";
}

// new 2026-01-12
function renderFileStatus() {
  fileStatus.textContent = `${documents.length} file(s) loaded.`;
  fileList.innerHTML = "";

  documents.forEach(doc => {
    const li = document.createElement("li");
    li.textContent = `${doc.name}`;
    fileList.appendChild(li);
  });
}

// new 2026-01-12
const CHUNK_SIZE = 400;   // new 2026-01-12
const CHUNK_OVERLAP = 50; // new 2026-01-12

// new 2026-01-12
function chunkAllDocuments() {
  chunks.length = 0; // reset

  documents.forEach(doc => {
    const text = doc.text || "";
    let start = 0;
    let index = 0;

    while (start < text.length) {
      const end = Math.min(start + CHUNK_SIZE, text.length);
      const chunkText = text.slice(start, end);

      chunks.push({
        id: crypto.randomUUID(),
        docId: doc.id,
        docName: doc.name,
        index,
        text: chunkText,
        charStart: start,
        charEnd: end
      });

      index++;
      start += CHUNK_SIZE - CHUNK_OVERLAP;
    }
  });

  renderChunkStatus();
}

// new 2026-01-12
function renderChunkStatus() {
  chunkStatus.textContent = `${chunks.length} chunk(s) created.`;
}

// new 2026-01-12
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

// new 2026-01-12
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    runSearch(searchInput.value);
  }
});

// new 2026-01-12
const STOP_WORDS = new Set([
  "what", "are", "is", "the", "on", "in", "of", "to", "and", "for"
]);

// new 2026-01-12
function normalizeTerms(query) {
  return query
    .toLowerCase()
    .replace(/[^\w\s]/g, "") // remove punctuation
    .split(/\s+/)
    .filter(term => term.length > 2 && !STOP_WORDS.has(term));
}

// new 2026-01-12
function runSearch(query) {
  searchResults.innerHTML = "";

  const terms = normalizeTerms(query);

  if (terms.length === 0) {
    searchResults.innerHTML = "<p>Please enter a more specific question.</p>";
    return;
  }

  const matches = chunks.filter(chunk =>
    terms.some(term =>
      chunk.text.toLowerCase().includes(term)
    )
  );

  renderSearchResults(matches);
}

// new 2026-01-12
function extractKeySentences(text, maxSentences = 2) {
  const sentences = text
    .split(/(?<=[.!?])\s+/)
    .map(s => s.trim())
    .filter(Boolean);

  return sentences.slice(0, maxSentences).join(" ");
}

// new 2026-01-12
function synthesizeAnswer(matches) {
  if (matches.length === 0) return null;

  // sort by doc then chunk order
  const ordered = [...matches].sort((a, b) => {
    if (a.docName !== b.docName) {
      return a.docName.localeCompare(b.docName);
    }
    return a.index - b.index;
  });

  let answerParts = [];
  let sources = [];

  ordered.forEach(match => {
    answerParts.push(
      extractKeySentences(match.text)
    );

    sources.push(
      `${match.docName} (chunk ${match.index + 1})`
    );
  });

  return {
    answer: answerParts.join(" "),
    sources: [...new Set(sources)]
  };
}

// new 2026-01-12
function renderSearchResults(matches) {
  searchResults.innerHTML = "";

  if (matches.length === 0) {
    searchResults.innerHTML = "<p>No matching content found.</p>";
    return;
  }

  const synthesized = synthesizeAnswer(matches);

  if (!synthesized) {
    searchResults.innerHTML = "<p>No matching content found.</p>";
    return;
  }

  const answerCard = document.createElement("div");
  answerCard.className = "card";
  answerCard.style.marginTop = "0.5rem";

  answerCard.innerHTML = `
    <p>${synthesized.answer}</p>
    <small><strong>Sources:</strong><br>${synthesized.sources.join("<br>")}</small>
  `;

  searchResults.appendChild(answerCard);
}

// new 2026-01-12
function highlightMatch(text) {
  const snippetLength = 300;
  return text.length > snippetLength
    ? text.slice(0, snippetLength) + "…"
    : text;
}
</script>

</body>
</html>
